name: Rupa Health
description: >-
  Rupa Health (now a Fullscript company) is a healthcare platform that lets
  functional and root-cause medicine practitioners order, track, and receive
  results from specialty and functional lab tests across hundreds of lab
  companies through a single unified dashboard. It provides a lab test catalog,
  patient result portals, practitioner ordering and billing, phlebotomy
  coordination, and educational resources (Rupa University, the Root Cause
  Medicine podcast, and a lab reference guide). Rupa integrates with a range of
  EHR/EMR systems used by independent practitioners but does not publish a
  public developer API or developer portal at this time. Backed by Bessemer
  Venture Partners and Union Square Ventures.
